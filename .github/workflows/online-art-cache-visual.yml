name: Online cached character art QA
on:
  push:
    paths:
      - 'online-game.js'
      - 'online-ipad.html'
      - 'online-embed.html'
      - 'guest-lab-game.html'
      - 'tests/online-art-cache-visual.cjs'
      - '.github/workflows/online-art-cache-visual.yml'
  workflow_dispatch:
jobs:
  cached-art:
    runs-on: ubuntu-24.04
    # Use the same Playwright browser image as the passing live/BOT suites.
    # It avoids Ubuntu apt mirror stalls before tests even start.
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: node tests/online-art-cache-visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shokoku-cache-art-visual
          path: qa-art-cache/
          retention-days: 14
