name: Online battle visual review
on:
  push:
    paths:
      - 'tests/online-battle-visual-review.cjs'
      - '.github/workflows/online-battle-visual-review.yml'
      - 'online-net.js'
      - 'online-game.js'
      - 'online-ipad.html'
  workflow_dispatch:
jobs:
  moving-battle:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/online-battle-visual-review.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shokoku-moving-battle-visual-qa
          path: qa-battle-visual/
          retention-days: 14
