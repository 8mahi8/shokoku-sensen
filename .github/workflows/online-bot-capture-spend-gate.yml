name: BOT capture spend gate QA
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/online-bot-capture-spend-gate.yml'
      - 'tests/online-bot-capture-spend-gate.cjs'
      - 'tests/online-bot-capture-spend-gate-replay.cjs'
      - 'online-game.js'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/online-bot-capture-spend-gate.cjs
      - run: node tests/online-bot-capture-spend-gate-replay.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-capture-spend-gate
          path: |
            qa-bot-capture-spend-gate
            qa-bot-capture-spend-gate-replay
          retention-days: 30
