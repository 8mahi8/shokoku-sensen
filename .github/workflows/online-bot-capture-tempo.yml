name: BOT capture tempo replay
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/online-bot-capture-tempo.yml'
      - 'tests/online-bot-capture-tempo-replay.cjs'
      - 'tests/online-bot-capture-tempo.cjs'
      - 'online-game.js'
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/online-bot-capture-tempo.cjs
      - run: node tests/online-bot-capture-tempo-replay.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-capture-tempo-replay
          path: |
            qa-bot-capture-tempo
            qa-bot-capture-tempo-replay
          retention-days: 30
