name: BOT castle budget opportunity QA
on:
  push:
    branches: [develop]
    paths:
      - 'tests/online-bot-castle-budget-opportunity.cjs'
      - '.github/workflows/online-bot-castle-budget-opportunity.yml'
  workflow_dispatch:
jobs:
  opportunity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/online-bot-castle-budget-opportunity.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-bot-castle-budget-opportunity
          path: qa-bot-castle-budget-opportunity
          retention-days: 30
