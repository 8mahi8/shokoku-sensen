name: BOT castle damage race QA
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/online-bot-castle-damage-race.yml'
      - 'tests/online-bot-castle-damage-race.cjs'
      - 'online-game.js'
  workflow_dispatch:
jobs:
  damage-race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/online-bot-castle-damage-race.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-bot-castle-damage-race
          path: qa-bot-castle-damage-race
          retention-days: 30
