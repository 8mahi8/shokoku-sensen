name: BOT castle siege forecast calibration QA
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/online-bot-castle-forecast-audit.yml'
      - 'tests/online-bot-castle-forecast-audit.cjs'
      - 'tests/analyze-castle-forecast.cjs'
      - 'tests/analyze-castle-interception.cjs'
      - 'tests/analyze-castle-precontact.cjs'
      - 'tests/analyze-castle-precontact-damage.cjs'
      - 'tests/analyze-castle-force-model.cjs'
      - 'tests/online-bot-castle-force-holdout.cjs'
      - 'tests/evaluate-castle-force-holdout.cjs'
      - 'online-game.js'
  workflow_dispatch:
jobs:
  forecast-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/online-bot-castle-forecast-audit.cjs
      - run: node tests/analyze-castle-forecast.cjs
      - run: node tests/analyze-castle-interception.cjs
      - run: node tests/analyze-castle-precontact.cjs
      - run: node tests/analyze-castle-precontact-damage.cjs
      - run: node tests/analyze-castle-force-model.cjs
      - run: node tests/online-bot-castle-force-holdout.cjs
      - run: node tests/evaluate-castle-force-holdout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-bot-castle-forecast-audit
          path: qa-bot-castle-forecast-audit
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-bot-castle-force-holdout
          path: qa-bot-castle-force-holdout
          retention-days: 30
