name: BOT forecast QA fast lane
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/online-bot-forecast.yml'
      - 'tests/online-bot-forecast.cjs'
      - 'tests/online-bot-spend-window.cjs'
      - 'tests/online-bot-early-screen.cjs'
      - 'tests/online-bot-opportunity-map.cjs'
      - 'online-game.js'
      - 'online-net.js'
      - 'online.html'
  workflow_dispatch:
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/online-bot-forecast.cjs
      - run: node tests/online-bot-spend-window.cjs
      - run: node tests/online-bot-early-screen.cjs
      - run: node tests/online-bot-opportunity-map.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-forecast-report
          path: |
            qa-bot-forecast
            qa-bot-spend-window
            qa-bot-early-screen
            qa-bot-opportunity-map
          retention-days: 30
