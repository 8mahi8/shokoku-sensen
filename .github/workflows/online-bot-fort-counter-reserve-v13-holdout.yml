name: BOT fort counter reserve V13 untouched holdout
on:
  push:
    branches: [develop]
    paths:
      - 'tests/online-bot-fort-counter-reserve-v13-holdout.cjs'
      - '.github/workflows/online-bot-fort-counter-reserve-v13-holdout.yml'
  workflow_dispatch:
jobs:
  independent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/online-bot-fort-counter-reserve-v13-holdout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-bot-fort-counter-v13-holdout
          path: qa-bot-fort-counter-v13-holdout
          retention-days: 30
