name: BOT fort counter reserve V13 paired QA
on:
  push:
    branches: [develop]
    paths:
      - 'tests/online-bot-fort-counter-reserve-v13.inc.js'
      - 'tests/online-bot-fort-counter-reserve-v13.cjs'
      - '.github/workflows/online-bot-fort-counter-reserve-v13.yml'
  workflow_dispatch:
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/online-bot-fort-counter-reserve-v13.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-bot-fort-counter-reserve-v13
          path: qa-bot-fort-counter-reserve-v13
          retention-days: 30
