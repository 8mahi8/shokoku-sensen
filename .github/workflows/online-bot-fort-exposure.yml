name: BOT fort loss exposure audit
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/online-bot-fort-exposure.yml'
      - 'tests/online-bot-fort-exposure.cjs'
      - 'online-game.js'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/online-bot-fort-exposure.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-bot-fort-exposure
          path: qa-bot-fort-exposure
          retention-days: 30
