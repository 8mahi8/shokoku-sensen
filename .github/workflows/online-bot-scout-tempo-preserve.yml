name: BOT short scout reserve QA
on:
  push:
    branches: [develop]
    paths:
      - 'online-game.js'
      - 'tests/online-bot-scout-tempo-preserve.cjs'
      - '.github/workflows/online-bot-scout-tempo-preserve.yml'
  workflow_dispatch:
jobs:
  scout-tempo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/online-bot-scout-tempo-preserve.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-bot-scout-tempo-preserve
          path: qa-bot-scout-tempo-preserve
          retention-days: 30
