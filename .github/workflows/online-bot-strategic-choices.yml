name: BOT strategic choice evidence
on:
  pull_request:
    branches: [develop]
    paths:
      - 'tests/online-bot-strategic-choices.cjs'
      - 'tests/online-bot-strategic-choices.inc.js'
      - '.github/workflows/online-bot-strategic-choices.yml'
      - 'online-game.js'
  push:
    branches: [feature/strong-bot-decision-opportunity-audit-20261020]
    paths:
      - 'tests/online-bot-strategic-choices.cjs'
      - 'tests/online-bot-strategic-choices.inc.js'
      - '.github/workflows/online-bot-strategic-choices.yml'
  workflow_dispatch:
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --check tests/online-bot-strategic-choices.cjs
      - run: node --check tests/online-bot-strategic-choices.inc.js
      - run: node tests/online-bot-strategic-choices.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-strategic-choice-evidence
          path: qa-bot-strategic-choices
          retention-days: 30
