name: BOT tactical regression
on:
  push:
    paths:
      - '.github/workflows/online-bot-tactics.yml'
      - 'tests/online-bot-tactics.cjs'
      - 'tests/online-bot-tournament.cjs'
      - 'tests/online-bot-evaluation.cjs'
      - 'tests/online-bot-selfplay.cjs'
      - 'tests/online-bot-ab.cjs'
      - 'tests/online-bot-holdout.cjs'
      - 'tests/online-heavy-value.cjs'
      - 'tests/online-bot-opponent-energy.cjs'
      - 'tests/online-bot-energy-opponents.cjs'
      - 'tests/online-bot-tempo.cjs'
      - 'tests/online-bot-priority-audit.cjs'
      - 'tests/online-bot-staged-budget.cjs'
      - 'online-embed.html'
      - 'online-game.js'
      - 'online-ipad.html'
  workflow_dispatch:
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/online-bot-tactics.cjs
      - run: node tests/online-bot-tournament.cjs
      - run: node tests/online-bot-evaluation.cjs
      - run: node tests/online-bot-selfplay.cjs
      - run: node tests/online-bot-ab.cjs
      - run: node tests/online-bot-holdout.cjs
      - run: node tests/online-heavy-value.cjs
      - run: node tests/online-bot-opponent-energy.cjs
      - run: node tests/online-bot-energy-opponents.cjs
      - run: node tests/online-bot-tempo.cjs
      - run: node tests/online-bot-priority-audit.cjs
      - run: node tests/online-bot-staged-budget.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-duel-baseline-report
          path: |
            qa-bot-tournament
            qa-bot-evaluation
            qa-bot-selfplay
            qa-bot-ab
            qa-bot-holdout
            qa-heavy-value
            qa-bot-opponent-energy
            qa-bot-energy-opponents
            qa-bot-tempo
            qa-bot-priority-audit
            qa-bot-staged-budget
          retention-days: 30
