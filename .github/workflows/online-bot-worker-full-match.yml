name: BOT Worker complete-match opportunity QA
on:
  push:
    branches: [develop]
    paths:
      - 'tests/online-bot-worker-real-duel.inc.js'
      - 'tests/online-bot-worker-full-match.cjs'
      - '.github/workflows/online-bot-worker-full-match.yml'
  workflow_dispatch:
jobs:
  full-matches:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/online-bot-worker-full-match.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-bot-worker-full-match
          path: qa-bot-worker-full-match
          retention-days: 30
