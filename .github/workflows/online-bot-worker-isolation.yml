name: BOT worker isolation and stale-result QA
on:
  push:
    branches: [develop]
    paths:
      - 'tests/online-bot-worker-prototype.js'
      - 'tests/online-bot-worker-bridge.inc.js'
      - 'tests/online-bot-worker-isolation.cjs'
      - '.github/workflows/online-bot-worker-isolation.yml'
  workflow_dispatch:
jobs:
  worker-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/online-bot-worker-isolation.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-bot-worker-isolation
          path: qa-bot-worker-isolation
          retention-days: 30
