name: BOT Worker actual-duel shadow telemetry
on:
  push:
    branches: [develop]
    paths:
      - 'tests/online-bot-worker-real-duel.inc.js'
      - 'tests/online-bot-worker-real-duel.cjs'
      - '.github/workflows/online-bot-worker-real-duel.yml'
  workflow_dispatch:
jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/online-bot-worker-real-duel.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-bot-worker-real-duel
          path: qa-bot-worker-real-duel
          retention-days: 30
