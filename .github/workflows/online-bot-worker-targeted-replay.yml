name: BOT Worker targeted real replay QA
on:
  push:
    branches: [develop]
    paths:
      - 'tests/online-bot-worker-targeted-replay.cjs'
      - '.github/workflows/online-bot-worker-targeted-replay.yml'
  workflow_dispatch:
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/online-bot-worker-targeted-replay.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-bot-worker-targeted-replay
          path: qa-bot-worker-targeted-replay
          retention-days: 30
