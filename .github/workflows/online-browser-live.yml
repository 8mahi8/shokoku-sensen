name: One-shot online two-browser live QA
on:
  push:
    paths:
      - '.github/workflows/online-browser-live.yml'
      - 'online-game.js'
      - 'online-net.js'
      - 'online.html'
      - 'online-ipad.html'
      - 'tests/online-browser-live.cjs'
  workflow_dispatch:
jobs:
  browser-live:
    runs-on: ubuntu-24.04
    # Use Playwright's version-matched official image: browser binaries and
    # Linux dependencies are already installed, avoiding flaky apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - video: 'yes'
            matched: 'no'
          - video: 'no'
            matched: 'no'
          # Roles are compared with identical WebKit engines, viewport,
          # touch input and the exact same pasteable iPad HTML.
          - video: 'no'
            matched: 'yes'
    env:
      SHOKOKU_QA_RECORD_VIDEO: ${{ matrix.video }}
      SHOKOKU_QA_MATCHED_WEBKIT: ${{ matrix.matched }}
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      # The pinned container already has matching Chromium and WebKit builds.
      - run: node tests/online-browser-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-real-firebase-guest-video-${{ matrix.video }}-webkit-host-${{ matrix.matched }}
          path: qa-online-guest-visual/
          retention-days: 14
