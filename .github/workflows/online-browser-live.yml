name: One-shot online two-browser live QA
on:
  push:
    paths:
      - '.github/workflows/online-browser-live.yml'
      - 'online-game.js'
      - 'online-net.js'
      - 'online.html'
      - 'online-ipad.html'
      - 'tests/online-browser-live.cjs'
  workflow_dispatch:
jobs:
  browser-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/online-browser-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-real-firebase-guest-video
          path: qa-online-guest-visual/
          retention-days: 14
