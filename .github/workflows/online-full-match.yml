name: Full match guest-stutter QA
on:
  push:
    paths:
      - 'tests/online-full-match.cjs'
      - '.github/workflows/online-full-match.yml'
  workflow_dispatch:
jobs:
  full-match:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Play complete online match and measure guest responsiveness
        run: node tests/online-full-match.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-match-guest-stutter-qa
          path: qa-full-match/
          retention-days: 14
