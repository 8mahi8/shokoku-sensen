name: School guest history A/B
on:
  push:
    paths:
      - 'tests/online-guest-history-ab.cjs'
      - '.github/workflows/online-guest-history-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: school-guest-history-${{ github.ref }}
  cancel-in-progress: true
jobs:
  webkit-guest-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/online-guest-history-ab.cjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - run: node tests/online-guest-history-ab.cjs
