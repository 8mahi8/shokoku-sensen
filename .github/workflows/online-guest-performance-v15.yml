name: Online guest freeze, iPad and aerial balance V15
on:
  push:
    branches: [develop]
    paths:
      - 'online-game.js'
      - 'online-net.js'
      - 'online.html'
      - 'online-ipad.html'
      - 'online-embed.html'
      - 'tests/online-guest-performance-v15.cjs'
      - '.github/workflows/online-guest-performance-v15.yml'
  workflow_dispatch:
jobs:
  browser-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/online-smoke.cjs
      - run: node tests/online-guest-performance-v15.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-guest-v15-results
          path: qa-guest-v15
          retention-days: 30
