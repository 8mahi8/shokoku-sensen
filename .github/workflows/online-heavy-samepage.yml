name: Online same-page WebKit perf QA
on:
  push:
    paths:
      - 'tests/online-heavy-samepage.cjs'
      - 'tests/online-static-war-vs-live.cjs'
      - 'tests/online-host-clock-cap-ab.cjs'
      - '.github/workflows/online-heavy-samepage.yml'
  workflow_dispatch:
jobs:
  stable-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - run: node tests/online-heavy-samepage.cjs
      - run: node tests/online-static-war-vs-live.cjs
      - run: node tests/online-host-clock-cap-ab.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shokoku-same-page-webkit-perf
          path: |
            qa-stable-browser/
            qa-static-war/
            qa-host-clock-ab/
          retention-days: 14
