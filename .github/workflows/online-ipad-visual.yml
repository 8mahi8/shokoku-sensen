name: Online iPad UI visual QA
on:
  push:
    paths:
      - '.github/workflows/online-ipad-visual.yml'
      - 'tests/online-ipad-ui.cjs'
      - 'tests/online-offline-bot.cjs'
      - 'tests/online-touch-interaction.cjs'
      - 'tests/online-mass-battle.cjs'
      - 'tests/online-grand-arrival.cjs'
      - 'tests/online-fort-navigation.cjs'
      - 'tests/online-bot-tactics.cjs'
      - 'online-game.js'
      - 'online-net.js'
      - 'online.html'
      - 'online-ipad.html'
  workflow_dispatch:
# Manual dispatches are isolated from push runs; they must not be replaced.
# Long visual QA can cancel superseded pushes.
concurrency:
  group: online-ipad-ui-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/online-ipad-ui.cjs
      - run: node tests/online-offline-bot.cjs
      - run: node tests/online-touch-interaction.cjs
      - run: node tests/online-mass-battle.cjs
      - run: node tests/online-grand-arrival.cjs
      - run: node tests/online-fort-navigation.cjs
      - run: node tests/online-bot-tactics.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-ipad-qa-screens
          path: |
            qa-ipad-screens
            qa-touch-captures
            qa-mass-battle
            qa-grand-arrival
            qa-fort-navigation
          retention-days: 14
