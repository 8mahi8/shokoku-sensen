name: Online iPad UI visual QA
on:
  push:
    paths:
      - '.github/workflows/online-ipad-visual.yml'
      - 'tests/online-ipad-ui.cjs'
      - 'tests/online-offline-bot.cjs'
      - 'online-game.js'
      - 'online-net.js'
      - 'online.html'
      - 'online-ipad.html'
  workflow_dispatch:
jobs:
  ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/online-ipad-ui.cjs
      - run: node tests/online-offline-bot.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-ipad-qa-screens
          path: qa-ipad-screens
          retention-days: 14
