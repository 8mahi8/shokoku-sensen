name: Online raster and sprite WebKit ABBA QA
on:
  push:
    paths:
      - 'tests/online-raster-sweep.cjs'
      - '.github/workflows/online-raster-sweep.yml'
  workflow_dispatch:
jobs:
  raster-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - run: node tests/online-raster-sweep.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shokoku-raster-sweep-webkit
          path: qa-raster-sweep/results.json
          retention-days: 14
