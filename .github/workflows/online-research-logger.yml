name: Online standalone game integrity
on:
  push:
    paths:
      - 'online-net.js'
      - 'online-game.js'
      - 'online-embed.html'
      - 'online-ipad.html'
      - 'online.html'
      - 'tests/online-smoke.cjs'
      - 'tests/online-sim.cjs'
      - '.github/workflows/online-research-logger.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: online-standalone-integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone game and two-client online behavior
        run: |
          node tests/online-smoke.cjs
          node tests/online-sim.cjs
      - name: Guard against obsolete research logging in school game
        run: |
          ! grep -q 'ShokokuResearch' online-ipad.html
          ! grep -q 'researchRounds' online-net.js
          ! grep -q 'archiveConsent' online-embed.html
