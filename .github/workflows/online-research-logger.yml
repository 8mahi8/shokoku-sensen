name: Opt-in match research logger QA
on:
  push:
    paths:
      - 'online-research.js'
      - 'online-embed.html'
      - 'online-ipad.html'
      - 'online-net.js'
      - 'tools/research/**'
      - 'functions/research/**'
      - 'tests/online-research-*'
      - 'tests/online-browser-live.cjs'
      - '.github/workflows/online-research-logger.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: online-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  log-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/online-research-log.cjs
      - run: node tests/online-research-cloud.cjs
      - run: node tests/online-research-cloud-export.cjs
      - run: node tests/online-research-server.cjs
      - run: node --check functions/research/index.js
      - run: python3 -m py_compile tools/research/prune-expired.py
      - run: python3 tools/research/prune-expired.py # No secret: must skip without reading/writing Firebase
      - run: node tests/online-sim.cjs
      - run: node tests/online-research-batch-analyzer.cjs
      - run: node tests/online-smoke.cjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/online-research-browser.cjs
