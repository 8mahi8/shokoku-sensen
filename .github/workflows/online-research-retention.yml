name: Private research data retention
on:
  workflow_dispatch:
  schedule:
    # On the DEFAULT branch only, at 17:00 JST daily.
    - cron: '0 8 * * *'
permissions:
  contents: read
concurrency:
  group: shokoku-private-research-cleanup
  cancel-in-progress: false
jobs:
  clean-expired-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHOKOKU_FIREBASE_MAINTENANCE_SA_JSON: ${{ secrets.SHOKOKU_FIREBASE_MAINTENANCE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Skip until admin has configured the private maintenance secret
        if: env.SHOKOKU_FIREBASE_MAINTENANCE_SA_JSON == ''
        run: echo "Research maintenance not configured; no Firebase access or writes."
      - name: Install runtime requirements
        if: env.SHOKOKU_FIREBASE_MAINTENANCE_SA_JSON != ''
        run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Delete up to 50 expired records from the research-only Firebase subtree
        if: env.SHOKOKU_FIREBASE_MAINTENANCE_SA_JSON != ''
        run: python tools/research/prune-expired.py --apply
      # Never upload raw matches, access tokens, private IDs, or Firebase exports
      # as artifacts. Public repositories expose workflow execution metadata.
