name: Online 1v1 smoke
on:
  push:
    paths:
      - 'online*'
      - 'tests/online-smoke.cjs'
      - 'tests/online-deck.cjs'
      - 'tests/online-stage1-combat.cjs'
      - 'tests/online-stage2-combat.cjs'
      - 'tests/online-balance-theory.cjs'
      - 'tools/build-online-bundles.cjs'
      - 'tests/online-sim.cjs'
      - 'tests/online-unit-target-priority.cjs'
      - '.github/workflows/online-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure school HTML bundle stays synchronized with game and character art
        run: node tools/build-online-bundles.cjs --check
      - run: node tests/online-smoke.cjs
      - name: Check deck catalog, 10 unique cards, and storage fallback
        run: node tests/online-deck.cjs
      - run: node tests/online-sim.cjs
      - name: Quantitative pre-implementation 1v1 balance sanity check
        run: node tests/online-balance-theory.cjs > /dev/null
      - name: Check priority-based unit AI (42 scenarios)
        run: node tests/online-unit-target-priority.cjs
      - name: Stage 1 and Stage 2 real battle extraction regressions
        run: |
          node tests/online-stage1-combat.cjs
          node tests/online-stage2-combat.cjs
      - name: Verify no automatic match collection in school build
        run: |
          ! grep -q 'ShokokuResearch' online-ipad.html
          ! grep -q 'archiveConsent' online-ipad.html
          grep -q 'function maybePublish' online-net.js
          grep -q 'function sendCommand' online-net.js
      - name: Firebase public read probe (does not modify data)
        shell: bash
        run: |
          code=$(curl -sS --max-time 12 -o /tmp/rtdb-probe.txt -w '%{http_code}' 'https://mygame-df915-default-rtdb.firebaseio.com/shokokuRooms1v1/__read_probe__.json') || code=NETWORK_ERROR
          echo "RTDB_PROBE_HTTP=$code"
          # Probe only access status; never print room keys or private data.
          root_code=$(curl -sS --max-time 12 -o /tmp/rtdb-room-list.json -w '%{http_code}' 'https://mygame-df915-default-rtdb.firebaseio.com/shokokuRooms1v1.json?shallow=true') || root_code=NETWORK_ERROR
          echo "RTDB_ROOM_LIST_HTTP=$root_code"
          # Log only the NUMBER of room keys, never any code, name or player state.
          if test "$root_code" = "200"; then
            node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/rtdb-room-list.json","utf8"));console.log("RTDB_VISIBLE_ROOM_COUNT="+Object.keys(r||{}).length);'
          fi
          if test -f /tmp/rtdb-probe.txt; then head -c 180 /tmp/rtdb-probe.txt; echo; fi
      - name: Prepare Google Sites paste file
        run: |
          cp online-ipad.html Shokoku_III_1v1_school_iPad.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Shokoku-III-1v1-iPad
          path: |
            Shokoku_III_1v1_school_iPad.txt
          retention-days: 30
