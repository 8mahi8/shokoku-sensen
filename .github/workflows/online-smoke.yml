name: Online 1v1 smoke
on:
  push:
    paths:
      - 'online*'
      - 'tests/online-smoke.cjs'
      - 'tests/online-sim.cjs'
      - '.github/workflows/online-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/online-smoke.cjs
      - run: node tests/online-sim.cjs
      - name: Firebase public read probe (does not modify data)
        shell: bash
        run: |
          code=$(curl -sS --max-time 12 -o /tmp/rtdb-probe.txt -w '%{http_code}' 'https://mygame-df915-default-rtdb.firebaseio.com/shokokuRooms1v1/__read_probe__.json') || code=NETWORK_ERROR
          echo "RTDB_PROBE_HTTP=$code"
          if test -f /tmp/rtdb-probe.txt; then head -c 180 /tmp/rtdb-probe.txt; echo; fi
      - name: Prepare Google Sites paste file
        run: cp online-ipad.html Shokoku_III_1v1_school_iPad.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Shokoku-III-1v1-iPad
          path: Shokoku_III_1v1_school_iPad.txt
          retention-days: 30
