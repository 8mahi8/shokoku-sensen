name: Online terrain viewport A/B experiment
on:
  push:
    paths:
      - 'tests/online-terrain-viewport-ab.cjs'
      - '.github/workflows/online-terrain-viewport-ab.yml'
  workflow_dispatch:
jobs:
  terrain-viewport-ab:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: node tests/online-terrain-viewport-ab.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-crop-ab-evidence
          path: qa-terrain-viewport-ab/
          retention-days: 14
