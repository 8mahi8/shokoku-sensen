name: Online time-over result UI WebKit sync
on:
  push:
    paths:
      - 'tests/online-timeover-result-ui.cjs'
      - '.github/workflows/online-timeover-result-ui.yml'
      - 'online-game.js'
      - 'online-ipad.html'
  workflow_dispatch:
jobs:
  timeover-result:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: node tests/online-timeover-result-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-timeover-result-host-guest
          path: qa-online-timeover-ui/
          retention-days: 14
