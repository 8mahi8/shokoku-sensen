<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>小国戦線III｜1台ゲストテスト</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#07151d;color:#e9f6f7;font-family:system-ui,-apple-system,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:7px 10px;min-height:48px;background:#102e39;border-bottom:1px solid #436572}
header strong{font-size:13px;white-space:nowrap}
button{font:inherit;color:#11292f;background:#e8d08d;border:0;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:800}
button:disabled{opacity:.45}
#status{flex:1;min-width:0;font-size:11px;line-height:1.35;color:#e4edec;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hostWrap{height:77px;flex-shrink:0;background:#132b35;display:flex;gap:6px;padding:4px 8px;border-bottom:1px solid #36545f}
#hostCaption{width:160px;flex-shrink:0;font-size:11px;line-height:1.4;padding:6px;color:#c6d6db}
#hostFrame{height:65px;width:100%;border:1px solid #264553;border-radius:7px;pointer-events:none;background:#07151d}
#guestWrap{flex:1;min-height:0;position:relative}
#guestFrame{width:100%;height:100%;display:block;border:0;background:#06151d}
#message{display:none;position:absolute;top:6px;left:6px;right:6px;text-align:center;padding:7px;background:#122c39ed;border:1px solid #658b95;border-radius:6px;font-size:12px;pointer-events:none}
@media(max-width:720px){header{padding:5px;gap:5px;min-height:44px}header strong{font-size:11px}button{padding:7px;font-size:11px}#hostWrap{height:59px;padding:3px}#hostCaption{width:118px;padding:2px;font-size:10px}#hostFrame{height:53px}}
</style>
</head>
<body>
<header>
 <strong>🔴 ゲスト実通信テスト</strong>
 <span id="status" role="status">読み込み中…</span>
 <button id="start" type="button" disabled>テスト開始</button>
 <button id="restart" type="button" disabled>やり直す</button>
</header>
<div id="hostWrap">
 <div id="hostCaption">🤖 青軍BOT（ホスト）<div id="hostState">準備中</div></div>
 <iframe id="hostFrame" title="BOTホスト（自動操作）" loading="eager"></iframe>
</div>
<main id="guestWrap">
 <iframe id="guestFrame" title="君の操作画面（赤軍ゲスト）" loading="eager"></iframe>
 <div id="message"></div>
</main>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id),host=$("hostFrame"),guest=$("guestFrame");
const status=$("status"),start=$("start"),restart=$("restart");
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const deadline=async (fn,label,timeout=25000)=>{
 const end=Date.now()+timeout;
 while(Date.now()<end){try{const v=fn();if(v)return v}catch{}await sleep(200)}
 throw Error(label+"で応答がありません。回線を確認してから再試行してください");
};
const testParams=new URLSearchParams(location.search),qa=testParams.has("qa")&&
 (location.hostname==="localhost"||location.hostname==="127.0.0.1")?"&qa=1":"";
const base="guest-lab-game.html?guestLab=";
let started=false,roomCode="";
const hdoc=()=>host.contentDocument,gdoc=()=>guest.contentDocument;
function connected(frame){return frame.contentDocument?.getElementById("netStatus")?.textContent?.includes("接続OK")}
function enter(frame,id){const button=frame.contentDocument?.getElementById(id);if(!button||button.disabled)throw Error(id+"が使用できません");button.click();}
function setStatus(value){status.textContent=value}
function setMsg(value){$("message").style.display=value?"block":"none";$("message").textContent=value}
function loadFrame(frame,src){return new Promise((resolve,reject)=>{frame.addEventListener("load",resolve,{once:true});frame.addEventListener("error",()=>reject(Error("ゲームの読み込み失敗")),{once:true});frame.src=src})}
async function load(){
 await Promise.all([loadFrame(host,base+"host"+qa),loadFrame(guest,base+"guest"+qa)]);
 await deadline(()=>host.contentWindow?.ShokokuNet&&guest.contentWindow?.ShokokuNet,"ゲーム準備");
 await deadline(()=>connected(host)&&connected(guest),"Firebase接続",30000);
 start.disabled=false;restart.disabled=false;setStatus("接続OK。テスト開始を押してね");
}
async function launch(){
 if(started)return;started=true;start.disabled=true;
 try{
  setMsg("");setStatus("BOTがルームを作成中…");
  enter(host,"netCreate");
  roomCode=await deadline(()=>{
   const value=hdoc().getElementById("netRoom")?.textContent?.trim()||"";
   return /^\d{5}$/.test(value)?value:null;
  },"ルーム作成");
  setStatus("ルーム"+roomCode+"：ゲストが参加中…");
  gdoc().getElementById("netJoinCode").value=roomCode;
  enter(guest,"netJoin");
  await deadline(()=>gdoc().getElementById("netSeat")?.textContent?.includes("ゲスト")&&
   gdoc().getElementById("netRoom")?.textContent?.trim()===roomCode,"ゲスト参加");
  await deadline(()=>!hdoc().getElementById("netReady").disabled&&
   !gdoc().getElementById("netReady").disabled,"双方の準備");
  enter(host,"netReady");enter(guest,"netReady");
  await deadline(()=>!hdoc().getElementById("netStart").disabled,"開始準備");
  enter(host,"netStart");
  await deadline(()=>host.contentWindow.ShokokuNet.syncDiagnostics().phase==="playing"&&
   guest.contentWindow.ShokokuNet.syncDiagnostics().phase==="playing","開戦");
  setStatus("赤軍ゲストでプレイ中。ルーム"+roomCode);
  $("hostState").textContent="自動対戦中";
  setMsg("");
 }catch(error){
  started=false;start.disabled=false;
  setMsg(error.message);setStatus("エラー。やり直すを押してください");
 }
}
start.addEventListener("click",launch);
restart.addEventListener("click",async()=>{
 restart.disabled=true;start.disabled=true;setStatus("ルームを終了中…");
 try{host.contentWindow?.ShokokuNet?.resetLobby();guest.contentWindow?.ShokokuNet?.resetLobby();}catch{}
 await sleep(900);location.reload();
});
window.addEventListener("pagehide",()=>{
 try{host.contentWindow?.ShokokuNet?.resetLobby();guest.contentWindow?.ShokokuNet?.resetLobby();}catch{}
});
load().catch(e=>{setStatus(e.message);setMsg(e.message);restart.disabled=false});
})();
</script>
</body>
</html>
